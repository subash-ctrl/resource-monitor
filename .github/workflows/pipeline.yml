name: Resource Audit Pipeline

on:
  push:
    branches:
      - main

jobs:
  post-audit-to-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Post to Agile Board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1 --body-file audit_report.md
